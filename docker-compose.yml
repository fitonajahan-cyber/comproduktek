services:

  postgres:
    image: postgres:16-alpine
    container_name: dukteksi_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-dukteksi_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-dukteksi_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: dukteksi_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 5000
      NODE_ENV: production
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-dukteksi_db}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-changeme}
      JWT_SECRET: ${JWT_SECRET:-ganti_wajib_ini_dengan_string_rahasia_panjang}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      SEED_ADMIN_USERNAME: ${SEED_ADMIN_USERNAME:-admin}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@dukteksi.mil.id}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-UbahPasswordIni123!}
      SEED_ADMIN_FULLNAME: ${SEED_ADMIN_FULLNAME:-Administrator Dukteksi}
    volumes:
      # Persist file uploads agar tidak hilang saat container restart
      - uploads_data:/app/uploads
    # Port backend tidak di-expose langsung ke luar, hanya diakses dari Nginx
    expose:
      - "5000"
    # Jalankan seed otomatis saat pertama kali start, lalu jalankan server
    command: sh -c "node seed-all.js && node server.js"

  frontend:
    build:
      context: ./frontend
    container_name: dukteksi_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${APP_PORT:-80}:80"

volumes:
  postgres_data:
  uploads_data:
